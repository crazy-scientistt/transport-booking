[build]
command = "pnpm run build"
publish = "dist/public"

# IMPORTANT:
# Do not add www/non-www or trailing-slash 301 redirects here.
# The previous SEO package forced a specific host and route trailing slashes.
# If the DNS/host/Cloudflare panel is configured differently, those rules
# create ERR_TOO_MANY_REDIRECTS.
# Canonical URLs are now handled in sitemap/meta only, not by app-level redirects.

[[headers]]
for = "/assets/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/assets/vehicles/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/sitemap.xml"
  [headers.values]
  Cache-Control = "public, max-age=3600"
  Content-Type = "application/xml; charset=utf-8"

[[headers]]
for = "/robots.txt"
  [headers.values]
  Cache-Control = "public, max-age=3600"
  Content-Type = "text/plain; charset=utf-8"

[[headers]]
for = "/index.html"
  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

# React/Vite SPA fallback. This is a rewrite, not a browser redirect.
# It lets /makkah-ziyarat-taxi/ and other SEO URLs load without a redirect loop.
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[build]
command = "pnpm run build"
publish = "dist/public"

[[redirects]]
from = "https://umrahtaxi.cab/*"
to = "https://www.umrahtaxi.cab/:splat"
status = 301
force = true

[[headers]]
for = "/assets/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/assets/vehicles/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/sitemap.xml"
  [headers.values]
  Cache-Control = "public, max-age=3600"
  Content-Type = "application/xml; charset=utf-8"

[[headers]]
for = "/robots.txt"
  [headers.values]
  Cache-Control = "public, max-age=3600"
  Content-Type = "text/plain; charset=utf-8"

[[headers]]
for = "/index.html"
  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
from = "/jeddah-airport-to-makkah-taxi"
to = "/jeddah-airport-to-makkah-taxi/"
status = 301
force = true

[[redirects]]
